<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compte démo MT5 — MyFlowFX</title><style>body{font-family:system-ui;background:#f5f7f3;color:#183429;max-width:650px;margin:50px auto;padding:20px}form,section{background:white;padding:24px;border-radius:14px;margin:20px 0}label{display:block;margin:16px 0 5px}input,button{box-sizing:border-box;width:100%;padding:12px;font:inherit}button{margin-top:20px;background:#206548;color:white;border:0;border-radius:8px}a{color:#206548}</style></head><body><a href="/app">← Retour à MyFlowFX</a><h1>Connecter un compte MT5 démo</h1><p>Cette étape vérifie la connexion. La gestion automatique n'est pas encore activée.</p><form id="direct-form"><label for="login">Numéro du compte</label><input id="login" inputmode="numeric" required><label for="server">Serveur du courtier</label><input id="server" required><label for="password">Mot de passe MT5 démo</label><input id="password" type="password" autocomplete="off" required><button>Vérifier mon compte démo</button><p id="message" role="status"></p></form><section><h2>Comptes enregistrés</h2><div id="accounts">Chargement…</div></section><script>
const token=localStorage.getItem('tf_token');if(!token)location.replace('/app');
async function request(url,options={}){const response=await fetch(url,{...options,headers:{Authorization:'Bearer '+token,...(options.body?{'Content-Type':'application/json'}:{})},cache:'no-store'});let result=await response.json();if(!response.ok)throw Error(result.error||'Service indisponible');return result}
async function loadAccounts(){try{const result=await request('/api/demo/accounts');const box=document.getElementById('accounts');box.replaceChildren();if(!result.accounts.length){box.textContent='Aucun compte enregistré.';return}for(const a of result.accounts){const item=document.createElement('p');item.textContent=a.login+' · '+a.server+' · '+({pending:'Vérification en attente',verified_demo:'Compte démo vérifié',failed:'Vérification impossible',rejected_live:'Compte réel refusé'}[a.status]||'Statut inconnu');box.appendChild(item)}}catch(e){document.getElementById('accounts').textContent=e.message}}
document.getElementById('direct-form').addEventListener('submit',async event=>{event.preventDefault();const message=document.getElementById('message');try{let data=await request('/api/demo/accounts',{method:'POST',body:JSON.stringify({login:document.getElementById('login').value.trim(),server:document.getElementById('server').value.trim(),password:document.getElementById('password').value,label:''})});document.getElementById('password').value='';message.textContent=data.message;await loadAccounts()}catch(e){document.getElementById('password').value='';message.textContent=e.message}});
loadAccounts();
</script></body></html>
